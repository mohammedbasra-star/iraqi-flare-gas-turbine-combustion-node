[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iraqi-flare-gas-turbine-combustion-node"
version = "0.1.0"
description = "Associated Petroleum Gas (APG) Combustion Kinetics & Sulfur Oxidation in Gas Turbines with Stiff Neural ODEs"
authors = [{ name = "Mohammed Basra", email = "researcher@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0"
]
